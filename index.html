<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witan Thailand — All-in-One K-Beauty Partner</title>
    <meta name="description" content="Witan Thailand — Thai subsidiary of Witan Company. R&D, materials, OEM/ODM, FDA, clinical, and Korea–Thailand logistics under one partner." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page-title="meta.tagline">
    <div data-layout="header"></div>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero__inner">
            <span class="hero__eyebrow" data-i18n="home.hero.eyebrow"></span>
            <h1 class="hero__title" data-i18n="home.hero.title"></h1>
            <p class="hero__lead" data-i18n="home.hero.lead"></p>
            <div class="hero__cta">
              <a class="btn btn--primary" href="services.html" data-i18n="home.hero.cta1"></a>
              <a class="btn btn--ghost" href="contact.html" data-i18n="home.hero.cta2"></a>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section__head">
            <span class="section__eyebrow" data-i18n="home.intro.eyebrow"></span>

        <div class="container">

          <div class="svc-grid">
            <a class="svc-card" href="services/rnd.html">

            <a class="svc-card" href="services/oem.html">
              <div class="svc-card__num">03</div>

              <span class="svc-card__more" data-i18n="home.services.more"></span>
            </a>
            <a class="svc-card" href="services/fda.html">
              <div class="svc-card__num">04</div>
              <h3 class="svc-card__title" data-i18n="home.services.fda.title"></h3>

              <span class="svc-card__more" data-i18n="home.services.more"></span>
            </a>
            <a class="svc-card" href="services/clinical.html">
              <div class="svc-card__num">05</div>
              <h3 class="svc-card__title" data-i18n="home.services.clinical.title"></h3>
              <p class="svc-card__desc" data-i18n="home.services.clinical.desc"></p>
              <span class="svc-card__more" data-i18n="home.services.more"></span>
            </a>
            <a class="svc-card" href="services/logistics.html">
              <div class="svc-card__num">06</div>
              <h3 class="svc-card__title" data-i18n="home.services.logistics.title"></h3>
              <p class="svc-card__desc" data-i18n="home.services.logistics.desc"></p>
              <span class="svc-card__more" data-i18n="home.services.more"></span>
            </a>
          </div>
        </div>

      <section class="section">
        <div class="container">
          <div class="section__head"><h2 data-i18n="home.stats.title"></h2></div>
          <div class="stats">
            <div>
              <div class="stat__num" data-i18n="home.stats.stat1.num"></div>

              <div class="stat__num" data-i18n="home.stats.stat2.num"></div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
