<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Material Sales — Witan Thailand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-service="materials">
    <div data-layout="header" data-base="../"></div>

    <main>
      <section class="page-header">
        <div class="container">
          <div class="page-header__crumb" data-i18n-svc="crumb"></div>
          <h1 data-i18n-svc="title"></h1>
          <p class="hero__lead" style="margin: 0 auto" data-i18n-svc="lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="split">
            <div>
              <p data-i18n-svc="p1"></p>
              <ul class="feature-list" data-i18n-svc="features"></ul>
              <div style="margin-top: 32px;">
                <a class="btn btn--primary" href="../contact.html" data-i18n="home.cta.btn"></a>
                <a class="btn btn--ghost" href="../services.html" data-i18n="services.crumb"></a>
              </div>
            </div>
            <div class="split__visual" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="cta-strip">
        <div class="container">
          <h2 data-i18n="home.cta.title"></h2>
          <p data-i18n="home.cta.lead"></p>
          <a class="btn btn--primary" href="../contact.html" data-i18n="home.cta.btn"></a>
        </div>
      </section>
    </main>

    <div data-layout="footer" data-base="../"></div>

    <script src="../js/layout.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
