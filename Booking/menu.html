<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HANAHAYAN Clinic & Beauty · Menu v50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Prompt:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A; --navy-d:#111D36; --gold:#AE9B6B; --gold-l:#C6B486; --gold-d:#8D7B57;
    --gold-soft:#E6DDCB; --ink:#22262E; --muted:#8A8578; --line:#E4DCC9; --bg:#FFFFFF; --soft:#F7F4EE;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:'Prompt','Noto Sans KR','Noto Sans JP','Noto Sans SC',sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .page{max-width:760px;margin:0 auto;padding:0 22px 60px}

  .benefits{margin:26px 0 6px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--soft)}
  .bn-head{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:var(--gold-l);
    padding:12px 18px;font-size:13px;letter-spacing:2.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .bn-row{display:flex;gap:12px;align-items:baseline;padding:11px 18px;border-top:1px solid var(--line);background:#fff}
  .bn-row:first-of-type{border-top:none}
  .bn-badge{flex:0 0 auto;min-width:52px;text-align:center;background:var(--navy);color:var(--gold-l);
    border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;letter-spacing:.5px}
  .bn-badge.gold{background:linear-gradient(135deg,var(--gold-d),var(--gold));color:#fff}
  .bn-body{flex:1}
  .bn-t{font-size:13.5px;font-weight:600;color:var(--ink)}
  .bn-x{font-size:12px;color:var(--muted);margin-top:1px}
  .bn-note{padding:9px 18px;font-size:11px;color:var(--muted);background:var(--soft);border-top:1px solid var(--line)}
  .ba{display:flex;gap:8px;margin-top:9px}
  .ba figure{flex:1;max-width:150px;margin:0;position:relative;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .ba img{width:100%;height:96px;object-fit:cover;display:block}
  .ba figcaption{position:absolute;top:6px;left:6px;background:rgba(17,29,54,.82);color:var(--gold-l);
    font-size:9.5px;letter-spacing:1.5px;font-weight:600;padding:2px 7px;border-radius:5px}
  @media print{.ba img{height:80px}}
  .pdfbtn{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:7px;
    background:linear-gradient(135deg,var(--navy),var(--navy-d));color:var(--gold-l);border:1px solid var(--gold-d);
    border-radius:999px;padding:11px 18px;font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;
    box-shadow:0 4px 14px rgba(17,29,54,.28);font-family:inherit}
  .pdfbtn:active{transform:scale(.97)}
  @media print{
    .langbar,.pdfbtn{display:none!important}
    body{background:#fff}
    .page{max-width:100%;padding:0}
    .benefits,.bn-row,.grp-wrap,.prog{break-inside:avoid;page-break-inside:avoid}
    .section{break-before:auto}
    .sec-head{break-after:avoid;page-break-after:avoid}
  }
  @page{margin:12mm}
  .langbar{position:sticky;top:0;z-index:20;display:flex;gap:6px;justify-content:center;
    padding:12px 0;background:linear-gradient(180deg,var(--bg) 70%,rgba(255,255,255,0));margin-bottom:4px}
  .langbtn{border:1.3px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
    padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Prompt',sans-serif;font-weight:500;transition:.15s}
  .langbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .langbtn:focus-visible{outline:2px solid var(--gold-d);outline-offset:2px}

  .hero{text-align:center;padding:30px 0 26px}
  .brand{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;
    letter-spacing:.22em;color:var(--navy);line-height:1;text-indent:.22em}
  .brand-sub{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;
    letter-spacing:.32em;color:var(--gold-d);margin-top:8px;text-indent:.32em}
  .subt{font-family:'Prompt',sans-serif;font-size:11px;letter-spacing:.34em;
    color:var(--gold-d);margin-top:9px;font-weight:500;text-transform:uppercase}
  .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;
    color:var(--muted);margin-top:16px}
  .tagline-x{font-size:12px;color:var(--muted);margin-top:3px}
  .rule{width:48px;height:2px;background:var(--gold);margin:20px auto 0;border-radius:2px}

  .section{margin-top:40px}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .sec-no{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;
    color:var(--gold-l);line-height:1;min-width:40px}
  .sec-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;
    color:var(--navy);letter-spacing:.01em}
  .sec-sub{font-size:12px;color:var(--gold-d);font-weight:500;letter-spacing:.04em;margin-top:1px}
  .sec-desc{font-size:12px;color:var(--muted);margin:8px 0 18px;padding-left:54px;line-height:1.55}

  /* ===== Before/After Gallery ===== */
  .ba-gallery{padding-left:54px;margin:0 0 22px}
  .ba-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold,#AE9B6B);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .ba-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
  .ba-pair{flex:0 0 auto;scroll-snap-align:start;background:#fff;border:1px solid #ece7dc;border-radius:10px;padding:8px;box-shadow:0 1px 4px rgba(27,42,74,.06)}
  .ba-imgs{display:flex;gap:6px}
  .ba-slot{position:relative;width:118px;height:150px;border-radius:7px;overflow:hidden;background:#f4f1ea;display:flex;align-items:center;justify-content:center}
  .ba-slot img{width:100%;height:100%;object-fit:cover;display:block}
  .ba-slot .ba-lab{position:absolute;left:0;bottom:0;right:0;font-size:10px;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(27,42,74,.72));padding:10px 0 3px;font-weight:600;letter-spacing:.05em}
  .ba-slot.empty{cursor:pointer;flex-direction:column;gap:4px;color:#b7ad97;font-size:11px;border:1.5px dashed #d8d0bd}
  .ba-slot.empty:hover{background:#efe9db;color:#8c8577}
  .ba-slot.empty .ba-hint{font-size:8.5px;color:#c3bba6;margin-top:2px;line-height:1.2;text-align:center;padding:0 4px}
  .ba-slot.armed{border:2px solid var(--gold,#AE9B6B);background:#f6efdd;color:#8a7a4e;box-shadow:0 0 0 3px rgba(174,155,107,.18)}
  .ba-slot.armed .ba-hint{color:#8a7a4e;font-weight:600}
  .ba-slot.dragover{border:2px solid var(--navy,#1B2A4A);background:#e8ecf4}
  .ba-slot .ba-plus{font-size:22px;line-height:1}
  .ba-cap{font-size:10px;color:var(--muted,#8a8578);text-align:center;margin-top:5px;min-height:12px}
  .ba-cap-input{display:none;width:100%;box-sizing:border-box;margin-top:6px;font-size:11px;text-align:center;border:1px solid #e0d9c8;border-radius:6px;padding:4px 6px;color:#3a4b6b;font-family:inherit;background:#fffdf8}
  .ba-cap-input:focus{outline:none;border-color:var(--gold,#AE9B6B)}
  .ba-cap-view{font-size:11px;color:#3a4b6b;text-align:center;margin-top:6px;min-height:14px;font-weight:500}
  .edit-on .ba-cap-input{display:block}
  .edit-on .ba-cap-view{display:none}
  .ba-slot.filled{cursor:default}
  .edit-on .ba-slot.filled{cursor:move}
  .ba-focus-hint{position:absolute;top:4px;left:4px;font-size:8.5px;background:rgba(27,42,74,.72);color:#fff;padding:2px 5px;border-radius:4px;display:none;pointer-events:none}
  .edit-on .ba-slot.filled:hover .ba-focus-hint{display:block}
  .ba-slot-tools{position:absolute;bottom:4px;left:0;right:0;display:none;justify-content:center;gap:5px}
  .edit-on .ba-slot.filled:hover .ba-slot-tools{display:flex}
  .ba-tbtn{width:24px;height:24px;border-radius:50%;background:rgba(27,42,74,.82);color:#fff;border:none;font-size:12px;line-height:24px;cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .ba-tbtn:hover{background:rgba(27,42,74,1)}
  .ba-tbtn.danger:hover{background:#b3403a}
  .ba-toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy,#1B2A4A);color:#fff;padding:10px 14px;border-radius:24px;font-size:12px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:100}
  .ba-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .ba-toast button{background:var(--gold,#AE9B6B);color:#fff;border:none;border-radius:14px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
  @media print{.ba-cap-input{display:none!important}.ba-cap-view{display:block!important}.ba-focus-hint,.ba-slot-tools{display:none!important}}
  .ba-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(27,42,74,.82);color:#fff;border:none;font-size:12px;line-height:20px;cursor:pointer;display:none;padding:0}
  .edit-on .ba-del{display:block}
  .ba-addpair{flex:0 0 auto;width:60px;min-height:150px;border:1.5px dashed #d8d0bd;border-radius:10px;background:transparent;color:#b7ad97;font-size:24px;cursor:pointer;display:none;align-items:center;justify-content:center}
  .edit-on .ba-addpair{display:flex}
  .ba-gallery.empty-hide{display:none}
  .edit-on .ba-gallery.empty-hide{display:block}
  .edit-badge{position:fixed;bottom:16px;right:16px;z-index:99;background:var(--navy,#1B2A4A);color:#fff;border:none;border-radius:22px;padding:9px 16px;font-size:12px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.25);cursor:pointer;letter-spacing:.03em}
  .edit-badge.on{background:var(--gold,#AE9B6B)}
  @media print{.ba-gallery.empty-hide{display:none!important}.ba-addpair,.ba-del,.edit-badge,.ba-slot.empty{display:none!important}.ba-strip{flex-wrap:wrap;overflow:visible}}


  .item{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item-body{flex:1;min-width:0}
  .item-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--ink);line-height:1.2}
  .item-dev{font-size:10px;color:#B7AFA2;margin-top:2px;letter-spacing:.02em;font-family:'Prompt',sans-serif}
  .feature .f-dev{font-size:9.5px;color:rgba(255,255,255,.62);margin-top:2px;letter-spacing:.02em}
  .item-x{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .item-meta{font-size:10.5px;color:var(--gold-d);margin-top:4px;letter-spacing:.02em;font-weight:500}
  .pack3{display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:6px;
    background:var(--soft);border:1px solid var(--gold-l);border-radius:8px;padding:4px 10px;
    font-size:11px;color:var(--navy);font-weight:600;font-family:'Prompt',sans-serif}
  .pack3 .lab{background:var(--navy);color:#fff;border-radius:5px;padding:1px 7px;font-size:9.5px;font-weight:700;letter-spacing:.03em}
  .pack3 .sep{color:var(--gold-l)}
  .pack3 .tot{color:var(--gold-d);font-weight:700}
  .pack3 .tot b{color:var(--navy);font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:700}
  .durs{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .dur{flex:1 1 88px;min-width:88px;border:1px solid var(--gold-l);border-radius:9px;padding:5px 6px 6px;
    text-align:center;background:var(--soft);font-family:'Prompt',sans-serif}
  .dur.on{border:1.5px solid var(--gold-d);background:#fff;box-shadow:0 1px 5px rgba(174,155,107,.18)}
  .dur .dtag{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;color:var(--gold-d);min-height:11px}
  .dur.on .dtag{color:#fff;background:var(--gold-d);border-radius:4px;padding:0 3px;margin:0 auto 1px;width:fit-content}
  .dur .dm{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .dur .dp{display:block;font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--navy);line-height:1.15}
  .dur .d3{display:block;font-size:8.5px;color:var(--gold-d);font-weight:600;letter-spacing:.01em}
  .dur .dx{display:block;font-size:8.5px;color:var(--muted);line-height:1.3;margin-top:2px}
  .feature .dur{background:rgba(255,255,255,.12);border-color:rgba(198,180,133,.45)}
  .feature .dur.on{background:rgba(255,255,255,.2);border-color:var(--gold-l)}
  .feature .dur .dp{color:#fff}
  .feature .dur .dm,.feature .dur .dx{color:rgba(255,255,255,.66)}
  .feature .dur .d3{color:var(--gold-l)}
  .feature .dur .dtag{color:var(--gold-l)}
  .feature .dur.on .dtag{background:var(--gold);color:var(--navy-d)}
  .price-note{display:block;font-size:9.5px;color:var(--muted);text-align:right;letter-spacing:.02em}
  .feature .price-note{color:rgba(255,255,255,.6)}
  .tier3{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
  .tier3 .t-lab{font-size:8px;color:var(--muted);letter-spacing:.04em}
  .tier3 .t-reg{font-size:11px;color:var(--muted)}
  .tier3 .t-reg s{color:var(--muted)}
  .tier3 .t-mem{font-size:12.5px;color:var(--gold-d);font-weight:600}
  .tier3 .t-promo{display:flex;flex-direction:column;align-items:flex-end;margin-top:2px}
  .tier3 .t-badge{font-size:8.5px;font-weight:700;letter-spacing:.04em;background:#C0392B;color:#fff;
    border-radius:20px;padding:2px 8px;margin-bottom:2px}
  .tier3 .t-big{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;color:#C0392B;line-height:1}
  .tier3 .t-big .b{font-size:15px;vertical-align:top;margin-right:1px}
  .addon-off{display:inline-block;background:var(--gold-soft);color:var(--gold-d);border:1px solid var(--gold-l);
    border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;font-family:'Prompt',sans-serif;white-space:nowrap}
  .feature .addon-off{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(198,180,133,.5)}
  .feature .pack3{background:rgba(255,255,255,.13);border-color:rgba(198,180,133,.5);color:#fff;margin-top:7px}
  .feature .pack3 .lab{background:var(--gold);color:var(--navy-d)}
  .feature .pack3 .sep{color:rgba(255,255,255,.4)}
  .feature .pack3 .tot{color:var(--gold-l)}
  .feature .pack3 .tot b{color:#fff}
  .badge{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.05em;
    background:var(--gold);color:#fff;padding:2px 8px;border-radius:20px;margin-left:6px;
    vertical-align:middle;font-family:'Prompt',sans-serif}
  .item-price{text-align:right;white-space:nowrap;flex-shrink:0}
  .price{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--navy)}
  .price .b{font-size:14px;vertical-align:top;margin-right:1px}
  .was{display:block;font-size:11px;color:var(--muted);text-decoration:line-through;margin-bottom:1px}
  .price-note{font-size:10px;color:var(--gold);margin-top:2px}
  .free-tag{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--gold);letter-spacing:.05em}

  .grp{font-family:'Prompt',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold-d);margin:24px 0 4px;padding-bottom:6px;
    border-bottom:1.5px solid var(--gold);display:inline-block}
  .grp-wrap{margin-top:8px}

  .feature{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-d) 100%);
    color:#fff;border-radius:14px;padding:18px 20px;margin-top:16px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    box-shadow:0 8px 22px rgba(174,155,107,.26)}
  .feature .f-name{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600}
  .feature .f-x{font-size:11px;opacity:.92;margin-top:3px}
  .feature .f-meta{font-size:10px;opacity:.82;margin-top:5px;letter-spacing:.03em}
  .feature .f-price{text-align:right;white-space:nowrap}
  .feature .f-price .p{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}
  .feature .f-price .was{color:#fff;opacity:.65;font-size:11px}
  .feature .f-price .save{font-size:10px;color:var(--gold-l);margin-top:2px;font-weight:600}
  .feature .star{font-size:9px;background:var(--gold);color:var(--navy-d);font-weight:700;
    padding:2px 9px;border-radius:20px;letter-spacing:.05em;display:inline-block;margin-bottom:6px}

  .note{background:var(--soft);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
    padding:11px 15px;font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6}
  .note b{color:var(--gold-d)}

  /* care program cards */
  .prog{border:1.3px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden;background:#fff}
  .prog-head{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;
    padding:13px 17px;display:flex;align-items:center;gap:11px}
  .prog-head .pico{font-size:20px;line-height:1}
  .prog-head .pt{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;line-height:1.15}
  .prog-head .ps{font-size:10.5px;opacity:.9;margin-top:1px;letter-spacing:.02em}
  .prog-body{padding:2px 17px 8px}
  .prog-body .item:first-child{border-top:none}

  /* membership tiers */
  .tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .tier{border:1.3px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff;position:relative}
  .tier.best{border-color:var(--gold);background:var(--soft)}
  .tier .tname{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--ink)}
  .tier .tload{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;color:var(--navy);margin-top:4px}
  .tier .tbonus{font-size:11px;color:var(--gold);font-weight:600;margin-top:3px}
  .tier .tval{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.4}
  .tier .tstar{position:absolute;top:-9px;right:12px;font-size:9px;font-weight:700;letter-spacing:.05em;
    background:var(--gold);color:#fff;padding:2px 9px;border-radius:20px;font-family:'Prompt',sans-serif}
  @media(max-width:440px){.tiers{grid-template-columns:1fr}}

  .foot{margin-top:48px;padding-top:26px;border-top:1.5px solid var(--gold);text-align:center}
  .foot-brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;letter-spacing:.1em;color:var(--navy)}
  .foot-line{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
  .foot-line b{color:var(--gold-d)}
  .foot-tags{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .ftag{font-size:10px;color:var(--gold-d);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
  .disclaimer{font-size:10px;color:var(--muted);margin-top:16px;line-height:1.5}

  /* ── A4 print: each section on its own page ── */
  @page{size:A4;margin:14mm 13mm}
  @media print{
    .langbar{display:none!important}
    .page{max-width:100%;padding:0}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}
    .hero{page-break-after:always;padding-top:60px}
    .section{page-break-before:always;margin-top:0;padding-top:8px}
    .prog,.feature,.tier,.tiers,.item,.sec-head{break-inside:avoid}
    .foot{page-break-before:always}
  }
</style>
</head>
<body>
<div class="page">
  <div id="langbar" class="langbar"></div>

   noteHtml:{ko:'<b>HIFU는 샷 총량이 아니라 면적당 밀도가 결과를 만듭니다</b> · 모든 메뉴를 국제 표준 프로토콜과 같은 밀도(1.4mm 간격)로 시술합니다 · <b>체험(399→699→990→1,290)은 4.5mm 한 층을 좁은 면적에 정품 밀도로</b> — 200샷에서 시작해 400·600·800샷으로 · <b>총액은 200샷(399)이 최저, 샷당가는 800샷(1,290)이 최저</b> · 장비를 확인하는 회차입니다 · <b>효과(2,900~)부터 여러 심도가 들어가고, 찐(13,900~)은 1.5·3·4.5mm 전 층 풀커버입니다</b> · <b>층 애드온</b>으로 어떤 시술에나 층을 더할 수 있어요 (1.5mm 1,690 · 3mm 1,990 · 4.5mm 1,990 · 9mm 이중턱 1,990) — 층을 섞을수록 오래갑니다 · <b>마무리는 오늘 피부 증상으로 고르세요</b> — 건조·홍조·트러블·칙칙함·늘어짐·붓기별 물방울 초음파/고주파 애드온 (+390~590) · 결과는 1–2개월에 걸쳐 올라와 2–3개월에 자리잡습니다 · <b>체험 후 7일 내 정규 시술 예약 시 체험비 전액 차감</b>',en:'<b>HIFU results come from density per area, not total shot count</b> · every menu is delivered at the same density as the international standard protocol (1.4 mm spacing) · <b>the trials (฿399→699→990→1,290) are one 4.5 mm depth at full density on a small area</b> — 200 → 400 → 600 → 800 shots · <b>lowest total = 200 (฿399), lowest per-shot = 800 (฿1,290)</b> · <b>Results tier (฿2,900+) adds multiple depths, and The Real Thing (฿13,900+) covers all of 1.5 / 3 / 4.5 mm</b> · <b>depth add-ons</b> let you add a layer to any treatment (1.5 mm ฿1,690 · 3 mm ฿1,990 · 4.5 mm ฿1,990 · 9 mm double-chin ฿1,990) — more layers, longer-lasting · <b>pick your finisher by skin symptom today</b> — dryness, redness, breakouts, dullness, laxity or puffiness, each mapping to a waterdrop-ultrasound/RF add-on (+฿390–590) · results build over 1–2 months, settle at 2–3 · <b>trial fee fully credited when you book a regular treatment within 7 days</b>',th:'<b>ผลลัพธ์ HIFU มาจากความหนาแน่นต่อพื้นที่ ไม่ใช่จำนวนช็อตรวม</b> · ทุกเมนูยิงที่ความหนาแน่นเดียวกับโปรโตคอลมาตรฐานสากล (ระยะ 1.4 มม.) · <b>ทดลอง (399–999) ความหนาแน่นเท่ากัน แต่พื้นที่เล็กและมีระดับเดียว</b> เป็นการทดลองเครื่อง ไม่ใช่ยกทั้งใบหน้า · <b>ระดับเห็นผล (2,900+) เริ่มมีหลายระดับ และตัวจริง (13,900+) ครบทั้ง 1.5/3/4.5 มม.</b> · ผลลัพธ์ค่อยขึ้นใน 1–2 เดือน และคงที่ที่ 2–3 เดือน · <b>รายการเสริม</b> — LDM·ไครโอ·ไอออน นิยมปิดท้าย',ja:'<b>HIFUはショット総数ではなく面積あたりの密度が結果を決めます</b> · 全メニューを国際標準プロトコルと同じ密度(1.4mm間隔)で施術 · <b>体験(399〜999)は密度は同じで面積が小さく、深度も一つだけ</b> — 機器を確かめる回で、顔全体のリフトではありません · <b>効果(2,900〜)から複数深度、本気(13,900〜)は1.5·3·4.5mm全層フルカバー</b> · 結果は1〜2ヶ月かけて上がり2〜3ヶ月で定着 · <b>アドオン</b> — LDM·クライオ·イオントは鎮静仕上げに人気',zh:'<b>HIFU的效果来自单位面积密度·而非总发数</b>·所有菜单均按国际标准方案同等密度(间距1.4mm)施打·<b>体验(399~999)密度相同但面积小·且只有单一深度</b>·是体验仪器的场次·不是全脸提拉·<b>见效档(2,900起)开始多层深度·真章档(13,900起)1.5/3/4.5mm全层覆盖</b>·效果在1–2个月内累积·2–3个月稳定·<b>可加项</b>—LDM·冷疗·离子适合镇静收尾'}},

function n3(p){return (parseInt(String(p).replace(/,/g,''))*3).toLocaleString()}
function pack3Html(it){
  if(!it.p3)return '';
  return `<div class="pack3"><span class="lab">${tx(UI.mem)}</span>${tx(UI.sess)}
    <span class="sep">·</span>${tx(UI.per)} ฿${it.p3}
    <span class="sep">·</span><span class="tot">${tx(UI.total)} <b>฿${n3(it.p3)}</b></span></div>`;
}
function durHtml(it){
  if(!it.dur)return '';
  return `<div class="durs">${it.dur.map(d=>`<div class="dur${d.best?' on':''}">
      <span class="dtag">${d.best?tx(UI.popular):'&nbsp;'}</span>
      <span class="dm">${mins(d.m)}</span>
      <span class="dp"><span style="font-size:.62em">฿</span>${d.price}</span>
      ${d.p3?`<span class="d3">${tx(UI.mem)} ฿${d.p3}</span>`:''}
      ${d.x?`<span class="dx">${tx(d.x)}</span>`:''}
    </div>`).join('')}</div>`;
}
function baHtml(it){
  if(!it.ba)return '';
  const L={before:{ko:'BEFORE',en:'BEFORE',th:'ก่อน',ja:'BEFORE',zh:'前'},after:{ko:'AFTER',en:'AFTER',th:'หลัง',ja:'AFTER',zh:'后'}};
  return `<div class="ba">
    <figure><img src="${it.ba.before}" loading="lazy" alt="before"><figcaption>${tx(L.before)}</figcaption></figure>
    <figure><img src="${it.ba.after}" loading="lazy" alt="after"><figcaption>${tx(L.after)}</figcaption></figure>
  </div>`;
}
function itemHtml(it){
  const fMeta = it.meta && tx(it.meta) ? tx(it.meta) : '';
  if(it.feature){
    return `<div class="feature">
      <div>
        <span class="star">${it.star}</span>
        <div class="f-name">${typeof it.name==='object'?tx(it.name):it.name}</div>
        ${it.dev?`<div class="f-dev">${typeof it.dev==='object'?tx(it.dev):it.dev}</div>`:''}
        ${it.x?`<div class="f-x">${tx(it.x)}</div>`:''}
        ${fMeta?`<div class="f-meta">${fMeta}</div>`:(it.m?`<div class="f-meta">${mins(it.m)}</div>`:'')}
        ${it.dur?durHtml(it):pack3Html(it)}
        ${baHtml(it)}
      </div>
      <div class="f-price">
        ${it.addon?`${it.was?`<span class="was" style="margin-right:6px">${it.was} ${tx(UI.solo)||''}</span>`:''}<span class="p">${String(it.price).replace('+','+฿')}</span><span class="addon-off">${tx(UI.addonOff)}</span>`:`<span class="p">฿${it.dur?it.dur[0].price:it.price}</span>
        ${it.dur?`<span class="price-note">${tx(UI.from)}</span>`:''}
        ${it.was?`<span class="was">${it.was}</span>`:''}
        ${it.save?`<span class="save">${it.save}</span>`:''}`}
      </div></div>`;
  }
  const meta = it.free ? fMeta :
               it.byc ? tx(UI.byConsult) :
               fMeta ? fMeta :
               it.m ? mins(it.m) : '';
  const priceHtml = it.free
    ? `<span class="free-tag">${tx(UI.free)}</span>`
    : it.addon
    ? `${it.was?`<span class="was">${it.was}</span>`:''}<span class="price"><span class="b"></span>${String(it.price).replace('+','+฿')}</span><span class="addon-off" style="display:block;font-size:.62em;opacity:.75">${tx(UI.addonOff)}</span>`
    : it.dur
    ? `<span class="price"><span class="b">฿</span>${it.dur[0].price}</span><span class="price-note">${tx(UI.from)}</span>`
    : it.mem
    ? `<div class="tier3">
        <span class="t-reg"><span class="t-lab">${tx(UI.regular)}</span> <s>${it.was}</s></span>
        <span class="t-mem"><span class="t-lab">${tx(UI.member)}</span> ฿${it.mem}</span>
        <span class="t-promo"><span class="t-badge">${tx(UI.bigPromo)}</span><span class="t-big"><span class="b">฿</span>${it.price}</span></span>
      </div>`
    : `${it.was?`<span class="was">${it.was}</span>`:''}<span class="price"><span class="b">฿</span>${it.price}</span>${it.note?`<span class="price-note">${it.note}</span>`:''}`;
  return `<div class="item">
    <div class="item-body">
      <div class="item-name">${typeof it.name==='object'?tx(it.name):it.name}${it.free?`<span class="badge">FREE</span>`:''}</div>
      ${it.dev?`<div class="item-dev">${typeof it.dev==='object'?tx(it.dev):it.dev}</div>`:''}
      ${it.x?`<div class="item-x">${tx(it.x)}</div>`:''}
      ${meta?`<div class="item-meta">${meta}</div>`:''}
      ${it.dur?durHtml(it):pack3Html(it)}
      ${baHtml(it)}
    </div>
    <div class="item-price">${priceHtml}</div>
  </div>`;
}

let PDF_BUSY=false;
function makePdf(){
  if(PDF_BUSY)return;
  const btn=document.getElementById('pdfbtn');
  const pdfL={ko:'PDF 저장',en:'Save PDF',th:'บันทึก PDF',ja:'PDF保存',zh:'保存PDF'};
  const busyL={ko:'생성 중…',en:'Creating…',th:'กำลังสร้าง…',ja:'作成中…',zh:'生成中…'};
  const run=()=>{
    PDF_BUSY=true;btn.innerHTML='⏳ '+(busyL[LANG]||'...');
    const el=document.querySelector('.page');
    html2pdf().set({
      margin:[8,6,10,6],
      filename:'HANAHAYAN_Menu_'+LANG.toUpperCase()+'.pdf',
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,
        onclone:(doc)=>{const a=doc.getElementById('langbar');if(a)a.remove();
          const b=doc.getElementById('pdfbtn');if(b)b.remove();}},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],avoid:['.bn-row','.benefits','.grp-wrap','.prog','.sec-head']}
    }).from(el).save().then(()=>{PDF_BUSY=false;btn.innerHTML='⤓ '+(pdfL[LANG]||'PDF');})
      .catch(()=>{PDF_BUSY=false;btn.innerHTML='⤓ '+(pdfL[LANG]||'PDF');try{window.print();}catch(e){}});
  };
  if(window.html2pdf){run();return;}
  btn.innerHTML='⏳';
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
  s.onload=run;
  s.onerror=()=>{PDF_BUSY=false;btn.innerHTML='⤓ '+(pdfL[LANG]||'PDF');try{window.print();}catch(e){}};
  document.head.appendChild(s);
}

    h+=`</div>`;
  });
  h+=`<div class="foot">
    <div class="foot-brand">HANAHAYAN Clinic & Beauty</div>
    <div class="foot-line">
      <b>1st Floor, 94, Shinawatera Building</b><br>Soi Sukhumvit 23, Khlong Toei Nuea, Watthana, Bangkok 10110<br>

      <span class="ftag">Non-medical Aesthetic</span>
    </div>
    <div class="disclaimer">${tx(UI.disc)}</div>

  document.getElementById('menu').innerHTML=h;
  hydrateGalleries();
  const pdfL={ko:'PDF 저장',en:'Save PDF',th:'บันทึก PDF',ja:'PDF保存',zh:'保存PDF'};
  document.getElementById('pdfbtn').innerHTML='⤓ '+(pdfL[LANG]||'PDF');

  undo:{ko:'실행취소',en:'Undo',th:'เลิกทำ',ja:'元に戻す',zh:'撤销'}
};
function baT(o){return o[LANG]||o.ko}

/* ---- IndexedDB tiny wrapper ---- */
let _badb=null;
function baDB(){
  return new Promise((res,rej)=>{
    if(_badb)return res(_badb);
    const r=indexedDB.open('hnh_ba_photos',1);
    r.onupgradeneeded=e=>{const db=e.target.result; if(!db.objectStoreNames.contains('pairs'))db.createObjectStore('pairs',{keyPath:'id'});};
    r.onsuccess=e=>{_badb=e.target.result;res(_badb);};
    r.onerror=e=>rej(e);
  });
}
async function baAll(sec){
  const db=await baDB();
  return new Promise((res)=>{
    const out=[]; const tx=db.transaction('pairs','readonly').objectStore('pairs').openCursor();
    tx.onsuccess=e=>{const c=e.target.result; if(c){if(c.value.sec===sec)out.push(c.value); c.continue();} else {out.sort((a,b)=>a.ord-b.ord); res(out);}};
    tx.onerror=()=>res(out);
  });
}
async function baPut(rec){const db=await baDB(); return new Promise((res,rej)=>{const r=db.transaction('pairs','readwrite').objectStore('pairs').put(rec); r.onsuccess=()=>res(); r.onerror=e=>rej(e);});}
async function baDel(id){const db=await baDB(); return new Promise((res)=>{const r=db.transaction('pairs','readwrite').objectStore('pairs').delete(id); r.onsuccess=()=>res(); r.onerror=()=>res();});}

/* ---- image compression to keep DB light ---- */
function baCompress(file,maxW=900,q=0.82){
  return new Promise((res,rej)=>{
    const img=new Image(); const rd=new FileReader();
    rd.onload=()=>{img.onload=()=>{
      const sc=Math.min(1,maxW/img.width); const w=Math.round(img.width*sc), hh=Math.round(img.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      res(c.toDataURL('image/jpeg',q));
    }; img.onerror=rej; img.src=rd.result;};
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}

let BA_EDIT=false;

async function hydrateGalleries(){
  const gals=document.querySelectorAll('.ba-gallery');
  for(const g of gals){
    const sec=g.getAttribute('data-sec');
    const pairs=await baAll(sec);
    renderGallery(g,sec,pairs);
  }
  document.body.classList.toggle('edit-on',BA_EDIT);
}

function slotHtml(rec,side){
  const img=rec[side];
  if(img){
    const pos=rec[side+'Pos']||'50% 50%';
    return `<div class="ba-slot filled" data-id="${rec.id}" data-side="${side}"><img src="${img}" alt="${side}" style="object-position:${pos}" draggable="false"><span class="ba-lab">${baT(BA_LABELS[side])}</span><span class="ba-focus-hint">${baT(BA_LABELS.focusHint)}</span><div class="ba-slot-tools"><button class="ba-tbtn" data-act="replace" data-id="${rec.id}" data-side="${side}" title="${baT(BA_LABELS.replace)}">🔄</button><button class="ba-tbtn" data-act="resetfocus" data-id="${rec.id}" data-side="${side}" title="${baT(BA_LABELS.recenter)}">⌖</button><button class="ba-tbtn danger" data-act="rmimg" data-id="${rec.id}" data-side="${side}" title="${baT(BA_LABELS.removeImg)}">🗑</button></div></div>`;
  }
  return `<div class="ba-slot empty" data-id="${rec.id}" data-side="${side}"><span class="ba-plus">＋</span><span>${baT(BA_LABELS[side])}</span><span class="ba-hint">${baT(BA_LABELS.slotHint)}</span></div>`;
}

function renderGallery(g,sec,pairs){
  let html=`<div class="ba-title">${baT(BA_LABELS.title)} <span style="font-weight:400;color:#b7ad97;text-transform:none;letter-spacing:0">· ${baT(BA_LABELS.disclaimer)}</span></div><div class="ba-strip">`;
  pairs.forEach(rec=>{
    html+=`<div class="ba-pair">
      <div class="ba-imgs">
        ${slotHtml(rec,'before')}
        ${slotHtml(rec,'after')}
        <button class="ba-del" data-act="del" data-id="${rec.id}">✕</button>
      </div>
      <input class="ba-cap-input" data-act="cap" data-id="${rec.id}" value="${(rec.cap||'').replace(/"/g,'&quot;')}" placeholder="${baT(BA_LABELS.capPlaceholder)}" maxlength="60"><div class="ba-cap-view">${rec.cap?rec.cap:''}</div>
    </div>`;
  });
  html+=`<button class="ba-addpair" data-act="addpair" data-sec="${sec}">＋</button></div>`;
  g.innerHTML=html;
  g.classList.toggle('empty-hide', pairs.length===0);
}


/* ---- shared: apply an image file/blob to a slot ---- */
let BA_ARMED=null; // {id, side, el}
let _baToastT=null;
function baToast(msg,actionLabel,onAction){
  let el=document.getElementById('baToast');
  if(!el){el=document.createElement('div'); el.id='baToast'; el.className='ba-toast'; document.body.appendChild(el);}
  el.innerHTML=`<span>${msg}</span>`+(actionLabel?`<button id="baToastBtn">${actionLabel}</button>`:'');
  el.classList.add('show');
  if(onAction){const b=document.getElementById('baToastBtn'); if(b)b.onclick=async()=>{el.classList.remove('show'); await onAction();};}
  clearTimeout(_baToastT); _baToastT=setTimeout(()=>el.classList.remove('show'),4500);
}
async function baToolAction(tb){
  const act=tb.getAttribute('data-act');
  const id=tb.getAttribute('data-id'), side=tb.getAttribute('data-side');
  const db=await baDB();
  const getRec=async()=>await new Promise(res=>{const r=db.transaction('pairs','readonly').objectStore('pairs').get(id); r.onsuccess=()=>res(r.result);});
  const refresh=async()=>{const g=tb.closest('.ba-gallery'); const sec=g.getAttribute('data-sec'); renderGallery(g,sec,await baAll(sec));};
  if(act==='resetfocus'){
    const rec=await getRec(); if(rec){rec[side+'Pos']='50% 50%'; await baPut(rec); await refresh();}
  }else if(act==='replace'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=async()=>{ if(inp.files&&inp.files[0]){ await baResetPos(id,side); await baApplyImage(id,side,inp.files[0]); } };
    inp.click();
  }else if(act==='rmimg'){
    const rec=await getRec();
    if(rec){
      const bkImg=rec[side], bkPos=rec[side+'Pos'];
      rec[side]=''; rec[side+'Pos']='50% 50%'; await baPut(rec); await refresh();
      baToast(baT(BA_LABELS.deleted), baT(BA_LABELS.undo), async()=>{
        const r2=await getRec(); if(r2){r2[side]=bkImg; r2[side+'Pos']=bkPos||'50% 50%'; await baPut(r2); await refresh();}
      });
    }
  }
}
async function baResetPos(id,side){
  const db=await baDB();
  const rec=await new Promise(res=>{const r=db.transaction('pairs','readonly').objectStore('pairs').get(id); r.onsuccess=()=>res(r.result);});
  if(rec){rec[side+'Pos']='50% 50%'; await baPut(rec);}
}
async function baApplyImage(id,side,fileOrBlob){
  try{
    const data=await baCompress(fileOrBlob);
    const db=await baDB();
    const rec=await new Promise(res=>{const r=db.transaction('pairs','readonly').objectStore('pairs').get(id); r.onsuccess=()=>res(r.result);});
    if(rec){rec[side]=data; await baPut(rec);
      const g=document.querySelector(`.ba-gallery[data-sec="${rec.sec}"]`);
      if(g)renderGallery(g,rec.sec,await baAll(rec.sec));
    }
    BA_ARMED=null;
  }catch(err){alert('이미지 처리 실패 / image error');}
}
function baArmSlot(el,id,side){
  document.querySelectorAll('.ba-slot.armed').forEach(x=>{x.classList.remove('armed'); const h=x.querySelector('.ba-hint'); if(h)h.textContent=baT(BA_LABELS.slotHint);});
  el.classList.add('armed'); BA_ARMED={id,side,el};
  const h=el.querySelector('.ba-hint'); if(h)h.textContent=baT(BA_LABELS.armed);
}

/* ---- global paste: drops image into the armed slot (or first empty slot) ---- */
document.addEventListener('paste',async e=>{
  if(!BA_EDIT)return;
  const items=(e.clipboardData||{}).items||[];
  let blob=null;
  for(const it of items){ if(it.type&&it.type.indexOf('image')===0){ blob=it.getAsFile(); break; } }
  if(!blob)return;
  e.preventDefault();
  let target=BA_ARMED;
  if(!target){ // no armed slot: use first empty slot on the page
    const first=document.querySelector('.ba-slot.empty');
    if(first)target={id:first.getAttribute('data-id'),side:first.getAttribute('data-side')};
  }
  if(target)await baApplyImage(target.id,target.side,blob);
});

/* ---- drag & drop directly onto any empty slot ---- */
document.addEventListener('dragover',e=>{ const sl=e.target.closest&&e.target.closest('.ba-slot.empty'); if(sl&&BA_EDIT){e.preventDefault(); sl.classList.add('dragover');} });
document.addEventListener('dragleave',e=>{ const sl=e.target.closest&&e.target.closest('.ba-slot.empty'); if(sl)sl.classList.remove('dragover'); });
document.addEventListener('drop',async e=>{
  const sl=e.target.closest&&e.target.closest('.ba-slot.empty');
  if(!sl||!BA_EDIT)return;
  e.preventDefault(); sl.classList.remove('dragover');
  const f=(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])||null;
  if(f&&f.type.indexOf('image')===0){ await baApplyImage(sl.getAttribute('data-id'),sl.getAttribute('data-side'),f); }
});


/* ---- caption editing ---- */
document.addEventListener('input',async e=>{
  const inp=e.target.closest('.ba-cap-input'); if(!inp||!BA_EDIT)return;
  const id=inp.getAttribute('data-id');
  clearTimeout(inp._t);
  inp._t=setTimeout(async()=>{
    const db=await baDB();
    const rec=await new Promise(res=>{const r=db.transaction('pairs','readonly').objectStore('pairs').get(id); r.onsuccess=()=>res(r.result);});
    if(rec){rec.cap=inp.value; await baPut(rec);
      const v=inp.parentElement.querySelector('.ba-cap-view'); if(v)v.textContent=inp.value;
    }
  },350);
});

/* ---- drag to reposition focus point on filled images (edit mode) ---- */
let BA_DRAG=null;
function baFocusStart(el,clientX,clientY){
  const img=el.querySelector('img'); if(!img)return;
  BA_DRAG={el,img,id:el.getAttribute('data-id'),side:el.getAttribute('data-side')};
  baFocusMove(clientX,clientY);
}
function baFocusMove(clientX,clientY){
  if(!BA_DRAG)return;
  const r=BA_DRAG.el.getBoundingClientRect();
  let x=(clientX-r.left)/r.width*100, y=(clientY-r.top)/r.height*100;
  x=Math.max(0,Math.min(100,x)); y=Math.max(0,Math.min(100,y));
  BA_DRAG.img.style.objectPosition=x.toFixed(1)+'% '+y.toFixed(1)+'%';
  BA_DRAG._pos=x.toFixed(1)+'% '+y.toFixed(1)+'%';
}
async function baFocusEnd(){
  if(!BA_DRAG||!BA_DRAG._pos){BA_DRAG=null;return;}
  const {id,side,_pos}=BA_DRAG;
  const db=await baDB();
  const rec=await new Promise(res=>{const r=db.transaction('pairs','readonly').objectStore('pairs').get(id); r.onsuccess=()=>res(r.result);});
  if(rec){rec[side+'Pos']=_pos; await baPut(rec);}
  BA_DRAG=null;
}
document.addEventListener('mousedown',async e=>{
  if(!BA_EDIT)return;
  const tb=e.target.closest('.ba-tbtn');
  if(tb){ e.preventDefault(); e.stopPropagation(); await baToolAction(tb); return; }
  const el=e.target.closest('.ba-slot.filled'); if(el){e.preventDefault(); baFocusStart(el,e.clientX,e.clientY);}
});
document.addEventListener('mousemove',e=>{ if(BA_DRAG){e.preventDefault(); baFocusMove(e.clientX,e.clientY);} });
document.addEventListener('mouseup',()=>{ if(BA_DRAG)baFocusEnd(); });
document.addEventListener('touchstart',async e=>{
  if(!BA_EDIT)return;
  const tb=e.target.closest('.ba-tbtn');
  if(tb){ await baToolAction(tb); return; }
  const el=e.target.closest('.ba-slot.filled'); if(el){const t=e.touches[0]; baFocusStart(el,t.clientX,t.clientY);}
},{passive:true});
document.addEventListener('touchmove',e=>{ if(BA_DRAG){const t=e.touches[0]; baFocusMove(t.clientX,t.clientY);} },{passive:true});
document.addEventListener('touchend',()=>{ if(BA_DRAG)baFocusEnd(); });

/* ---- interaction (event delegation) ---- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const act=t.getAttribute('data-act');
  if(act==='addpair'){
    const sec=t.getAttribute('data-sec');
    const id='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    await baPut({id,sec,ord:Date.now(),before:'',after:'',cap:''});
    const g=document.querySelector(`.ba-gallery[data-sec="${sec}"]`);
    renderGallery(g,sec,await baAll(sec));
  }
  const emptySlot=e.target.closest('.ba-slot.empty');
  if(emptySlot && BA_EDIT){
    const id=emptySlot.getAttribute('data-id'), side=emptySlot.getAttribute('data-side');
    // if already armed -> open file picker; else arm it for paste
    if(emptySlot.classList.contains('armed')){
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange=async()=>{ if(inp.files&&inp.files[0]) await baApplyImage(id,side,inp.files[0]); };
      inp.click();
    }else{
      baArmSlot(emptySlot,id,side);
    }
    return;
  }
  if(act==='del'){
    const id=t.getAttribute('data-id');
    await baDel(id);
    const g=t.closest('.ba-gallery'); const sec=g.getAttribute('data-sec');
    renderGallery(g,sec,await baAll(sec));
  }
});

/* ---- edit-mode toggle button ---- */
function baToggleEdit(){
  BA_EDIT=!BA_EDIT;
  document.body.classList.toggle('edit-on',BA_EDIT);
  const b=document.getElementById('editBadge');
  b.textContent=BA_EDIT?baT(BA_LABELS.editOff):baT(BA_LABELS.editOn);
  b.classList.toggle('on',BA_EDIT);
  hydrateGalleries();
}
window.addEventListener('DOMContentLoaded',()=>{
  const b=document.createElement('button');
  b.id='editBadge'; b.className='edit-badge'; b.textContent=baT(BA_LABELS.editOn);
  b.onclick=baToggleEdit; document.body.appendChild(b);
});

function setLang(l){LANG=l;localStorage.setItem('hnh_menu_lang',l);render();
  const eb=document.getElementById('editBadge'); if(eb)eb.textContent=BA_EDIT?baT(BA_LABELS.editOff):baT(BA_LABELS.editOn);
  window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
