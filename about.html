<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About — Witan Thailand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page-title="nav.about">
    <div data-layout="header"></div>

    <main>
      <section class="page-header">
        <div class="container">
          <div class="page-header__crumb" data-i18n="about.crumb"></div>
          <h1 data-i18n="about.title"></h1>
          <p class="hero__lead" style="margin: 0 auto" data-i18n="about.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="split">
            <div>
              <span class="section__eyebrow" data-i18n="about.story.eyebrow"></span>
              <h2 data-i18n="about.story.title"></h2>
              <p data-i18n="about.story.p1"></p>
              <p data-i18n="about.story.p2"></p>
              <a class="btn btn--ghost" href="services.html" data-i18n="nav.services"></a>
            </div>
            <div class="split__visual" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="section section--alt">
        <div class="container">
          <div class="section__head">
            <span class="section__eyebrow" data-i18n="about.values.eyebrow"></span>
            <h2 data-i18n="about.values.title"></h2>
          </div>
          <div class="svc-grid">
            <div class="svc-card">
              <div class="svc-card__num">01</div>
              <h3 class="svc-card__title" data-i18n="about.values.v1.title"></h3>
              <p class="svc-card__desc" data-i18n="about.values.v1.desc"></p>
            </div>
            <div class="svc-card">
              <div class="svc-card__num">02</div>
              <h3 class="svc-card__title" data-i18n="about.values.v2.title"></h3>
              <p class="svc-card__desc" data-i18n="about.values.v2.desc"></p>
            </div>
            <div class="svc-card">
              <div class="svc-card__num">03</div>
              <h3 class="svc-card__title" data-i18n="about.values.v3.title"></h3>
              <p class="svc-card__desc" data-i18n="about.values.v3.desc"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="cta-strip">
        <div class="container">
          <h2 data-i18n="home.cta.title"></h2>
          <p data-i18n="home.cta.lead"></p>
          <a class="btn btn--primary" href="contact.html" data-i18n="home.cta.btn"></a>
        </div>
      </section>
    </main>

    <div data-layout="footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
